[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-engine"
version = "0.1.0"
description = "CINEFORGE video engine: Timeline JSON -> FFmpeg plans, Remotion generation, media analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["video_engine*"]
