[project]
name = "cineforge-video"
version = "0.1.0"
description = "CINEFORGE video engine: FFmpeg toolkit, storyboard slideshow renderer, analysis, Remotion runner"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cineforge_video*"]
