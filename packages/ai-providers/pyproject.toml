[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineforge-ai-providers"
version = "0.1.0"
description = "CINEFORGE provider abstraction: LLM/image/tts/stt/music/video with fallback chains (Z.ai GLM, OpenAI, Anthropic, offline mock tier)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "Pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["ai_providers*"]
