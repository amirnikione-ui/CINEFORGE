[project]
name = "cineforge-providers"
version = "0.1.0"
description = "CINEFORGE provider abstraction: capability registry, fallback chains, vendor adapters"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "Pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cineforge_providers*"]
