[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineforge-ai-providers"
version = "0.1.0"
description = "CINEFORGE capability interfaces + vendor providers + fallback chains (LLM, image, TTS, STT, music, video)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pillow>=10.0",
]

[tool.setuptools]
packages = ["ai_providers"]
