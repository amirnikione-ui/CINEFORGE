name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install engine
        run: |
          if [ -f packages/video-engine/pyproject.toml ]; then pip install -e ./packages/video-engine; fi
          pip install pytest pillow
      - name: Run tests (whatever exists yet)
        run: bash scripts/run_tests.sh

  # Enabled when FORGE lands backend/ (CF-010) and VEGA lands apps/web (CF-016):
  # backend-tests:  pytest backend/tests -q   (needs `pip install -r backend/requirements.txt`)
  # web-build:      cd apps/web && npm ci && npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install backend + engine
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./packages/video-engine
          pip install pytest
      - name: Run backend tests
        run: pytest backend/tests -q
        env:
          DATABASE_URL: sqlite:///./ci_backend.db
          STORAGE_ROOT: /tmp/ci-backend-storage
          LLM_PROVIDER: mock

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create default .env for compose validation
        run: cp -n .env.example .env
      - run: docker compose config -q

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No PAT-looking strings in tree
        run: |
          ! rg -n "gh[pousr]_[A-Za-z0-9]{20,}" --glob '!.git' .

  remotion-template-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: packages/video-engine/remotion-template
        run: npm install --no-audit --no-fund
      - name: Typecheck (CF-014 template)
        working-directory: packages/video-engine/remotion-template
        run: npx tsc --noEmit
