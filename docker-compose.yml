# CINEFORGE — full local stack.
#   docker compose up --build                # everything
#   docker compose --profile slim up api web # api+web only (sqlite, inline worker)
name: cineforge

services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cineforge:cineforge@postgres:5432/cineforge
      REDIS_URL: redis://redis:6379/0
      CINEFORGE_STORAGE_ROOT: /data/storage
    volumes:
      - cineforge_media:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "workers.celery_app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cineforge:cineforge@postgres:5432/cineforge
      REDIS_URL: redis://redis:6379/0
      CINEFORGE_STORAGE_ROOT: /data/storage
    volumes:
      - cineforge_media:/data/storage
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cineforge
      POSTGRES_PASSWORD: cineforge
      POSTGRES_DB: cineforge
    volumes:
      - cineforge_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineforge"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cineforge_media:
  cineforge_pg:
